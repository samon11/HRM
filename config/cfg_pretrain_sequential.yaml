# Sequential training config for ARC-1 -> ARC-2

defaults:
  - arch: hrm_v1_no_puzzle_emb
  - _self_

hydra:
  output_subdir: null

# Training stages (train on these datasets sequentially)
training_stages:
  # Stage 1: ARC-1
  - data_path: data/arc-aug-1000
    epochs: 1000
    eval_interval: 1000
    # Optional: override lr for this stage
    # lr: 1e-4
    # lr_min_ratio: 1.0
    # lr_warmup_steps: 2000

  # Stage 2: ARC-2 (continues from ARC-1 checkpoint)
  - data_path: data/arc-2-aug-1000
    epochs: 1000
    eval_interval: 1000
    # Optional: use different lr for fine-tuning on ARC-2
    # lr: 5e-5
    # lr_min_ratio: 0.1
    # lr_warmup_steps: 1000

# Hyperparams - Training (defaults for all stages)
global_batch_size: 250

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

# Standard hyperparameter settings for LM
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

# Puzzle embeddings training (not used when arch=hrm_v1_no_puzzle_emb)
puzzle_emb_lr: 1e-2

# Checkpointing
checkpoint_every_eval: True
checkpoint_every_stage: True  # Save checkpoint after completing each stage

# Extras
seed: 0
eval_save_outputs: []

# Resume training from checkpoint (optional)
resume_checkpoint: null
